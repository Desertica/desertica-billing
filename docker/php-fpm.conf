; php-fpm del contenedor: corre como `billing` (no hay directivas user/group), escucha en un socket Unix para nginx y escribe todo en stderr.
; runc deja stdout/stderr del contenedor a nombre del usuario del contenedor, por eso /proc/self/fd/2 se puede abrir sin root.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = warning
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 20s

[www]
listen = /run/billing/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Servicio interno de bajo volumen: pocos procesos. Si SQLite se queda corto, ver docs/DECISIONS.md.

; La configuración (BILLING_*) y los secretos llegan por variables de entorno del contenedor: php-fpm no debe vaciarlas.
clear_env = no
; Lo que el worker escriba en stderr (nuestro logger JSON) llega tal cual al log del contenedor.
catch_workers_output = yes
decorate_workers_output = no
; Corta una petición colgada antes que el límite de nginx (120 s): una emisión incluye hasta dos llamadas a SUNAT.
request_terminate_timeout = 110s
ping.path = /ping
