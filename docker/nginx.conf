# nginx para el contenedor: corre como el usuario no-root `billing`, escucha en 8080 y le pasa todo a php-fpm por un socket Unix.
# Errores a stderr (`stderr` es un valor especial de nginx: abrir /dev/stderr por ruta falla sin root cuando el descriptor es de root).
# No hay registro de accesos aquí: lo escribe la aplicación en JSON (RequestLogMiddleware) sin cabeceras ni query string.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    # Rutas temporales escribibles sin ser root (el directorio raíz puede ser de solo lectura).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log off;

    server {
        listen 8080 default_server;
        server_name _;

        # nginx corta antes de llegar a PHP: que el error siga siendo JSON como el resto de la API.
        error_page 413 @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"code":"VALIDATION_ERROR","message":"El cuerpo supera 1 MB."}';
        }

        # Todo pasa por el front controller; no se sirve ningún archivo del disco.
        location / {
            fastcgi_pass unix:/run/billing/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param HTTPS "";
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            # SUNAT puede tardar; el límite del lado PHP (request_terminate_timeout) es menor.
            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 30s;
        }
    }
}
