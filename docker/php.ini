; Producción: nada de errores en la respuesta; los errores van a stderr (los recoge php-fpm con catch_workers_output).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
html_errors = Off
; Las trazas de PHP incluirían los argumentos (certificado, clave SOL, XML): se omiten.
zend.exception_ignore_args = On
memory_limit = 256M
max_execution_time = 100
; Lectura de SOAP contra SUNAT; la conexión tiene su propio límite en VerifiedSoapClient.
default_socket_timeout = 45
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
soap.wsdl_cache_enabled = 0
